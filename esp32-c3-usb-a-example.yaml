# ESPHome configuration for ISolar/EASUN SMG II 6KW inverter – ESP32-C3 variant
#
# Identical register map and wiring approach as esp32-s2-mini-usb-a-example.yaml
# but targets an ESP32-C3 board with different UART pins.
#
# Hardware:
#   Board   : ESP32-C3 (e.g. ESP32-C3-DevKitM-1)
#   UART    : TX=GPIO5, RX=GPIO6  (change via substitutions)
#   Adapter : USB-A male DIP breakout → MAX3232 module → ESP32-C3
#
# See esp32-s2-mini-usb-a-example.yaml and README for full wiring details.

substitutions:
  name: smg-ii-c3
  device_description: "Monitor a ISolar/EASUN SMG II 6KW inverter via USB-A RS232 port"
  tx_pin: GPIO5
  rx_pin: GPIO6

esphome:
  name: ${name}
  friendly_name: ${name}
  comment: ${device_description}
  min_version: 2024.6.0
  on_boot:
    priority: -100
    then:
      - logger.log: "Sending inverter wakeup (01 AA 06 DE A2)"
      - uart.write:
          id: uart_0
          data: [0x01, 0xAA, 0x06, 0xDE, 0xA2]
      - delay: 300ms

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true
  reboot_timeout: 15min
  ap:
    ssid: "${name} Fallback"
    password: "smgii1234"

captive_portal:

logger:

api:

ota:
  platform: esphome

uart:
  id: uart_0
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

modbus:
  id: modbus_0
  uart_id: uart_0
  send_wait_time: 250ms

modbus_controller:
  - id: smg_ii
    address: 0x01
    modbus_id: modbus_0
    update_interval: 10s
    command_throttle: 50ms

# ── Switch: pause/resume Modbus polling from HA ───────────────────────────────
# Useful before sending manual wakeup or during inverter maintenance.
switch:
  - platform: template
    name: "${name} Modbus Polling"
    id: modbus_polling
    icon: "mdi:toggle-switch"
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    turn_on_action:
      - logger.log: "Modbus polling resumed"
      - component.resume: smg_ii
    turn_off_action:
      - logger.log: "Modbus polling suspended"
      - component.suspend: smg_ii

# ── Button: send wakeup frame from HA ────────────────────────────────────────
# Useful when the inverter was power-cycled while the ESP was already running.
# Suspends polling before sending to avoid FC 0xAA being misread as an error.
button:
  - platform: template
    name: "${name} Inverter Wakeup"
    icon: "mdi:power-cycle"
    on_press:
      - logger.log: "Manual wakeup (FC 0xAA) triggered from HA"
      - component.suspend: smg_ii
      - delay: 50ms
      - uart.write:
          id: uart_0
          data: [0x01, 0xAA, 0x06, 0xDE, 0xA2]
      - delay: 300ms
      - if:
          condition:
            switch.is_on: modbus_polling
          then:
            - component.resume: smg_ii

sensor:
  # ── 0x0050 block – AC / grid ───────────────────────────────────────────────
  - platform: modbus_controller
    modbus_controller_id: smg_ii
    name: "${name} Grid Voltage"
    register_type: holding
    address: 0x0050
    value_type: U_WORD
    filters:
      - multiply: 0.1
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1

  - platform: modbus_controller
    modbus_controller_id: smg_ii
    name: "${name} Grid Frequency"
    register_type: holding
    address: 0x0052
    value_type: U_WORD
    filters:
      - multiply: 0.01
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 2

  - platform: modbus_controller
    modbus_controller_id: smg_ii
    name: "${name} AC Power"
    register_type: holding
    address: 0x0053
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: smg_ii
    name: "${name} Output Voltage"
    register_type: holding
    address: 0x0058
    value_type: U_WORD
    filters:
      - multiply: 0.1
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1

  - platform: modbus_controller
    modbus_controller_id: smg_ii
    name: "${name} Output Frequency"
    register_type: holding
    address: 0x005A
    value_type: U_WORD
    filters:
      - multiply: 0.01
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 2

  - platform: modbus_controller
    modbus_controller_id: smg_ii
    name: "${name} Output Power"
    register_type: holding
    address: 0x005B
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: smg_ii
    name: "${name} Output Apparent Power"
    register_type: holding
    address: 0x005C
    value_type: U_WORD
    unit_of_measurement: "VA"
    state_class: measurement
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: smg_ii
    name: "${name} Load Percent"
    register_type: holding
    address: 0x005D
    value_type: U_WORD
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0

  # ── 0x0090 block – PV ─────────────────────────────────────────────────────
  - platform: modbus_controller
    modbus_controller_id: smg_ii
    name: "${name} PV Current"
    register_type: holding
    address: 0x0090
    value_type: U_WORD
    filters:
      - multiply: 0.1
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1

  - platform: modbus_controller
    modbus_controller_id: smg_ii
    name: "${name} PV Power"
    register_type: holding
    address: 0x0091
    value_type: U_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  # ── 0x00A4 block – temperatures (empirical, unconfirmed identity) ──────────
  # All three registers return plausible temperatures (~29 °C at low load).
  # Identity (DCDC / inverter / ambient) to be confirmed under load.
  - platform: modbus_controller
    modbus_controller_id: smg_ii
    name: "${name} Temp A"
    register_type: holding
    address: 0x00A4
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: smg_ii
    name: "${name} Temp B"
    register_type: holding
    address: 0x00A5
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: smg_ii
    name: "${name} Temp C"
    register_type: holding
    address: 0x00A6
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0

  # ── 0x0150 block – battery / charging ─────────────────────────────────────
  - platform: modbus_controller
    modbus_controller_id: smg_ii
    name: "${name} Battery Voltage"
    register_type: holding
    address: 0x0159
    value_type: U_WORD
    filters:
      - multiply: 0.1
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1

  - platform: modbus_controller
    modbus_controller_id: smg_ii
    name: "${name} Battery Current"
    register_type: holding
    address: 0x015D
    value_type: S_WORD
    filters:
      - multiply: 0.1
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1

  - platform: modbus_controller
    modbus_controller_id: smg_ii
    name: "${name} Float Voltage"
    register_type: holding
    address: 0x015C
    value_type: U_WORD
    filters:
      - multiply: 0.1
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1

  - platform: modbus_controller
    modbus_controller_id: smg_ii
    name: "${name} Bulk Charge Voltage"
    register_type: holding
    address: 0x0177
    value_type: U_WORD
    filters:
      - multiply: 0.1
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1

  - platform: wifi_signal
    name: "${name} WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "${name} Uptime"
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${name} IP Address"
    ssid:
      name: "${name} WiFi SSID"
