# ESPHome configuration for EASUN SMS-6.5KP-W-E offgrid inverter
#
# Hardware
#   Board   : ESP32-C3-DevKitM-1  (esp-idf framework)
#   Adapter : USB-A male DIP breakout → MAX3232 module → ESP32-C3
#   UART    : TX=GPIO6, RX=GPIO5  (adjust via substitutions if different)
#   Protocol: Modbus RTU 9600 8N1, device address 0x01
#
# Register addresses in this file were empirically validated against the
# energy balance equation:  P_out ≈ I_bat × V_bat × η
# See docs/deep-scan-process.md and scans/easun-sms-65kp-w-e/ for raw data.
#
# ⚠️  Do NOT use the standard SMG II decimal-address register map (addr 201+) —
#     it does not respond on this firmware variant.

substitutions:
  name: smg-ii-sms65
  friendly_name: "EASUN SMS-6.5KP-W-E"
  tx_pin: GPIO6
  rx_pin: GPIO5

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: "EASUN SMS-6.5KP-W-E offgrid inverter monitor"
  min_version: 2024.6.0
  on_boot:
    priority: -100
    then:
      - logger.log: "Sending inverter wakeup (01 AA 06 DE A2)"
      - uart.write:
          id: inverter_uart
          data: [0x01, 0xAA, 0x06, 0xDE, 0xA2]
      - delay: 300ms

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  framework:
    type: esp-idf

logger:

api:

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true
  reboot_timeout: 15min
  output_power: 8.5
  ap:
    ssid: "${name} Fallback"
    password: !secret fallback_password

captive_portal:

# ── UART → MAX3232 → Inverter ─────────────────────────────────────────────────
uart:
  id: inverter_uart
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  # Uncomment to debug raw serial frames:
  # debug:
  #   direction: BOTH
  #   dummy_receiver: true
  #   after:
  #     timeout: 100ms

# ── Modbus ────────────────────────────────────────────────────────────────────
modbus:
  id: inverter_modbus
  uart_id: inverter_uart
  send_wait_time: 250ms

modbus_controller:
  - id: smg_ii
    address: 0x01
    modbus_id: inverter_modbus
    update_interval: 10s
    command_throttle: 50ms

# ── Sensors ───────────────────────────────────────────────────────────────────
sensor:

  # ── AC / Grid (0x0050 block) ─────────────────────────────────────────────
  - platform: modbus_controller
    modbus_controller_id: smg_ii
    name: "Grid Voltage"
    register_type: holding
    address: 0x0050
    value_type: U_WORD
    filters:
      - multiply: 0.1
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1

  - platform: modbus_controller
    modbus_controller_id: smg_ii
    name: "Grid Frequency"
    register_type: holding
    address: 0x0052
    value_type: U_WORD
    filters:
      - multiply: 0.01
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 2

  - platform: modbus_controller
    modbus_controller_id: smg_ii
    name: "AC Power"
    register_type: holding
    address: 0x0053
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  # ── Output / Load (0x0058 block) ─────────────────────────────────────────
  - platform: modbus_controller
    modbus_controller_id: smg_ii
    name: "Output Voltage"
    register_type: holding
    address: 0x0058
    value_type: U_WORD
    filters:
      - multiply: 0.1
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1

  - platform: modbus_controller
    modbus_controller_id: smg_ii
    name: "Output Frequency"
    register_type: holding
    address: 0x005A
    value_type: U_WORD
    filters:
      - multiply: 0.01
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 2

  - platform: modbus_controller
    modbus_controller_id: smg_ii
    name: "Output Power"
    register_type: holding
    address: 0x0085      # raw value is directly in watts — no multiplier
    value_type: S_WORD   # ⚠️  do NOT use 0x005B (threshold behaviour below ~200 W)
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: smg_ii
    name: "Load Percent"
    register_type: holding
    address: 0x005D
    value_type: U_WORD
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0

  # ── Battery (0x0150 block) ───────────────────────────────────────────────
  - platform: modbus_controller
    modbus_controller_id: smg_ii
    name: "Battery Voltage"
    register_type: holding
    address: 0x0155      # measured voltage  ⚠️  do NOT use 0x0159 (nominal 48 V constant)
    value_type: U_WORD
    filters:
      - multiply: 0.1
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1

  - platform: modbus_controller
    modbus_controller_id: smg_ii
    name: "Battery Current"
    register_type: holding
    address: 0x0156      # ⚠️  do NOT use 0x015D (configuration constant, not a measurement)
    value_type: S_WORD   # negative = discharging
    filters:
      - multiply: 0.1
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1

  - platform: modbus_controller
    modbus_controller_id: smg_ii
    name: "Float Voltage"
    register_type: holding
    address: 0x015C
    value_type: U_WORD
    filters:
      - multiply: 0.1
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1

  - platform: modbus_controller
    modbus_controller_id: smg_ii
    name: "Bulk Charge Voltage"
    register_type: holding
    address: 0x0177
    value_type: U_WORD
    filters:
      - multiply: 0.1
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1

  # ── Temperature — experimental (0x00A4–0x00A6 block) ─────────────────────
  # Three registers reading the same value at low load; likely DCDC / inverter
  # / ambient — exact assignment not yet confirmed. Remove if not needed.
  - platform: modbus_controller
    modbus_controller_id: smg_ii
    name: "Temp A (0x00A4)"
    register_type: holding
    address: 0x00A4
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: smg_ii
    name: "Temp B (0x00A5)"
    register_type: holding
    address: 0x00A5
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: smg_ii
    name: "Temp C (0x00A6)"
    register_type: holding
    address: 0x00A6
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0

  # ── Diagnostic ───────────────────────────────────────────────────────────
  - platform: modbus_controller
    modbus_controller_id: smg_ii
    name: "Firmware Version"
    register_type: holding
    address: 0x001B
    value_type: U_WORD
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
    update_interval: 60s

# ── Text sensors ──────────────────────────────────────────────────────────────
text_sensor:
  # Serial number: 7 registers = 14 ASCII bytes
  # Note: raw_encode: ANSI only returns 2 chars — use lambda to read all 14 bytes
  - platform: modbus_controller
    modbus_controller_id: smg_ii
    name: "Serial Number"
    register_type: holding
    address: 0x0000
    register_count: 7
    entity_category: diagnostic
    lambda: |-
      std::string s;
      for (size_t i = 0; i < 14; i++) {
        char c = static_cast<char>(data[item->offset + i]);
        if (c >= 0x20 && c < 0x7F) s += c;
      }
      return s;

  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "WiFi SSID"

# ── Modbus polling switch ─────────────────────────────────────────────────────
# Pause/resume polling from Home Assistant — useful before sending the wakeup
switch:
  - platform: template
    name: "Modbus Polling"
    id: modbus_polling
    icon: "mdi:toggle-switch"
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    turn_on_action:
      - logger.log: "Modbus polling resumed"
      - component.resume: smg_ii
    turn_off_action:
      - logger.log: "Modbus polling suspended"
      - component.suspend: smg_ii

# ── Manual wakeup button ──────────────────────────────────────────────────────
# Suspends polling, sends wakeup frame, resumes polling if it was active
button:
  - platform: template
    name: "Inverter Wakeup (FC 0xAA)"
    icon: "mdi:power-cycle"
    on_press:
      - logger.log: "Manual wakeup triggered"
      - component.suspend: smg_ii
      - delay: 50ms
      - uart.write:
          id: inverter_uart
          data: [0x01, 0xAA, 0x06, 0xDE, 0xA2]
      - delay: 300ms
      - if:
          condition:
            switch.is_on: modbus_polling
          then:
            - component.resume: smg_ii
